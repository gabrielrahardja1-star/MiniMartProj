# pg_hba.conf — client authentication for the reporting mirror.
#
# This REPLACES the image default (it's passed as -c hba_file=...), so every
# allowed path must be listed here. Rules are matched top-to-bottom, first match
# wins; the final reject line denies everything else.
#
# After editing:  docker compose exec postgres pg_ctl reload
#
# TYPE  DATABASE            USER        ADDRESS              METHOD

# --- Local to the container (health checks, psql from `docker compose exec`) ---
local   all                 all                              trust
host    all                 all         127.0.0.1/32         scram-sha-256
host    all                 all         ::1/128              scram-sha-256

# --- The sync job (backend container -> postgres) over the Docker bridge net ---
# Docker Compose puts both containers on a 172.16.0.0/12 network.
host    all                 all         172.16.0.0/12        scram-sha-256

# --- Looker Studio (read-only role only, reporting DB only) -------------------
# Looker Studio connects from Google's published IP ranges. Look them up at
#   https://support.google.com/looker-studio/answer/7088031
# and add one `host` line per CIDR below, then reload. Example placeholders —
# REPLACE with the current list before relying on this:
#
# host  ${POSTGRES_DB:-minimart_reporting}  looker_ro   142.251.74.0/23   scram-sha-256
# host  ${POSTGRES_DB:-minimart_reporting}  looker_ro   66.249.64.0/19    scram-sha-256
#
# (pg_hba.conf does NOT expand ${...} — write the literal database name.)

# --- Deny everything not matched above --------------------------------------
host    all                 all         0.0.0.0/0            reject
host    all                 all         ::/0                 reject
