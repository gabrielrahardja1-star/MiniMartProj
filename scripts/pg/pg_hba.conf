# pg_hba.conf — client authentication for the minimart Postgres.
#
# This REPLACES the image default (it's passed as -c hba_file=...), so every
# allowed path must be listed here. Rules are matched top-to-bottom, first match
# wins; the final reject line denies everything else.
#
# After editing:  docker compose up -d --force-recreate postgres
#   (the file is bind-mounted and changes inode on `git pull`, so pg_ctl reload
#    keeps serving the old copy)
#
# TYPE  DATABASE   USER        ADDRESS              METHOD

# --- Local to the container (health checks, psql from `docker compose exec`) ---
local   all        all                              trust
host    all        all         127.0.0.1/32         scram-sha-256
host    all        all         ::1/128              scram-sha-256

# --- The app (backend container -> postgres) over the Docker bridge network ----
# Docker Compose puts both containers on a 172.16.0.0/12 network.
host    all        all         172.16.0.0/12        scram-sha-256

# --- Looker Studio (read-only role, production DB only) -----------------------
# Google's published range for Looker Studio's global infrastructure, per
# https://docs.cloud.google.com/looker/docs/studio/connect-to-postgresql
# (checked 2026-09-07). If these ever change, update here and force-recreate.
# The data-residency range (142.251.56.0/24) only applies to Looker Studio Pro
# with data residency enabled — not us.
host    minimart   looker_ro   142.251.74.0/23      scram-sha-256
host    minimart   looker_ro   2001:4860:4807::/48  scram-sha-256

# --- Deny everything not matched above --------------------------------------
host    all        all         0.0.0.0/0            reject
host    all        all         ::/0                 reject
