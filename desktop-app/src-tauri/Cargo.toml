[package]
name = "minimart-desktop"
version = "0.1.0"
description = "MiniMart Cashier Desktop App"
edition = "2021"

[lib]
name = "minimart_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-http = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "minimart-desktop"
path = "src/main.rs"
