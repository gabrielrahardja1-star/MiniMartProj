services:

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env
    environment:
      # Production database: the `minimart` DB in the postgres service below,
      # reached over the compose network. Password comes from .env.
      - DATABASE_URL=postgresql+psycopg://minimart:${POSTGRES_PASSWORD}@postgres:5432/minimart
      - DEBUG=false
      - ENV=production
    volumes:
      # Legacy SQLite file — kept mounted read-only-ish for one-shot migration /
      # rollback only; the app no longer uses it.
      - db_data:/app/data
      # Safety net if R2 is ever unconfigured — product photo uploads fall
      # back to local disk, which otherwise wouldn't survive a redeploy
      - uploads_data:/app/uploads
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # Production database. Also serves Looker Studio dashboards directly via the
  # read-only `looker_ro` role (see scripts/pg/).
  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - LOOKER_RO_PASSWORD=${LOOKER_RO_PASSWORD}
    volumes:
      - pg_data:/var/lib/postgresql/data
      # Runs once, on a fresh volume only: creates the looker_ro read-only role
      # and pins the DB timezone to UTC.
      - ./scripts/pg/10-init-readonly.sh:/docker-entrypoint-initdb.d/10-init-readonly.sh:ro
      # Client-auth allowlist. Edit to change Looker Studio's IP ranges, then
      # `docker compose up -d --force-recreate postgres`.
      - ./scripts/pg/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
    command:
      - postgres
      - -c
      - hba_file=/etc/postgresql/pg_hba.conf
      - -c
      - listen_addresses=*
    ports:
      # Host port 5433 (not 5432) — the VPS already runs a system PostgreSQL on
      # 5432. Container is still 5432 internally. Looker Studio connects to
      # <host>:5433; the access gate is pg_hba.conf (Docker port publishing
      # bypasses ufw) — also restrict 5433 at the Hostinger cloud firewall.
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  db_data:
  uploads_data:
  pg_data:
