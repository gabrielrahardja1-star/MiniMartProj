services:

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env
    environment:
      - DATABASE_URL=sqlite:////app/data/minimart.db
      - DEBUG=false
      - ENV=production
      # Read-only reporting mirror the app never reads from — only
      # scripts/sync_to_postgres.py writes to it. Blank REPORTING_DATABASE_URL in
      # .env disables the sync.
      - REPORTING_DATABASE_URL=${REPORTING_DATABASE_URL:-}
    volumes:
      # Persist the SQLite database file across container restarts
      - db_data:/app/data
      # Safety net if R2 is ever unconfigured — product photo uploads fall
      # back to local disk, which otherwise wouldn't survive a redeploy
      - uploads_data:/app/uploads
    ports:
      - "8000:8000"
    depends_on:
      - postgres
    restart: unless-stopped

  # Read-only Postgres copy of the SQLite DB, for Looker Studio dashboards.
  # NOT the production database — the app still runs entirely on SQLite.
  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - LOOKER_RO_PASSWORD=${LOOKER_RO_PASSWORD}
    volumes:
      - pg_data:/var/lib/postgresql/data
      # Runs once, on a fresh volume only: creates the looker_ro read-only role.
      - ./scripts/pg/10-init-readonly.sh:/docker-entrypoint-initdb.d/10-init-readonly.sh:ro
      # Client-auth allowlist. Edit this file to add Looker Studio's IP ranges,
      # then `docker compose exec postgres pg_ctl reload`.
      - ./scripts/pg/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
    command:
      - postgres
      - -c
      - hba_file=/etc/postgresql/pg_hba.conf
      - -c
      - listen_addresses=*
    ports:
      # Published for Looker Studio. The real access gate is pg_hba.conf (Docker
      # port publishing bypasses ufw) — keep the reject rule there tight, and
      # prefer also restricting 5432 at the Hostinger cloud firewall.
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  db_data:
  uploads_data:
  pg_data:
