services:

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env
    environment:
      - DATABASE_URL=sqlite:////app/data/minimart.db
      - DEBUG=false
      - ENV=production
    volumes:
      # Persist the SQLite database file across container restarts
      - db_data:/app/data
      # Safety net if R2 is ever unconfigured — product photo uploads fall
      # back to local disk, which otherwise wouldn't survive a redeploy
      - uploads_data:/app/uploads
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  db_data:
  uploads_data:
